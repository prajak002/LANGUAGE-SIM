    lat_lon: [25.0317, 87.8185]
    glottolog_aes: {status: threatened, source: "Moseley 2010 (UNESCO Atlas)", comment: "Satar (1447-sat) = Vulnerable"}
    scripts: [Olck (Ol Chiki; used by IndicParam and IndicTrans2), "Beng/Deva/Orya/Latn also reported in use -- TODO verify with a documentation source"]
    eval_data: {belebele: false, indicparam: sat (Ol Chiki, non-parallel, graduate-level), indictrans2: sat_Olck}
    feasibility: medium
    risks: ["No parallel MCQ data", "Expected low model competence -> small knowledge-conditioned denominators", "Multi-script variation"]
    role: "Only Munda language with any LLM benchmark found; exploratory arm"

