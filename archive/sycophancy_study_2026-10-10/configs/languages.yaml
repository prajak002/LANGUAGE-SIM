# Language metadata for the audit. Retrieved 2026-10-10.
#
# Provenance rules:
#  - glottocode / classification_path / lat / lon: Glottolog JSON API
#    (https://glottolog.org/resource/languoid/iso/<iso>.json), fetched 2026-10-10.
#  - glottolog_aes: Glottolog "AES status" + the source and comment Glottolog attributes it to,
#    copied verbatim from the languoid page on 2026-10-10. Glottolog aggregates these; they are
#    NOT our own vitality judgement. "Moseley 2010" = UNESCO Atlas (3rd ed.);
#    "Campbell et al. 2022" = Cataloguing the World's Endangered Languages (ELCat).
#  - Fields marked `TODO` have NOT been verified; never fill them from memory.
#  - Speaker counts are deliberately omitted until checked against Census of India 2011
#    (C-16 tables) or a cited documentation source.
#
# NOTE: genealogy (classification_path) is NOT typology. Typological features must come
# from URIEL/lang2vec or Grambank and be recorded per feature, with coverage gaps noted.

schema_version: 1
retrieved: 2026-10-10

# ---------------------------------------------------------------------------
# A. Originally proposed Eastern-India candidates (from the earlier plan)
# ---------------------------------------------------------------------------
candidates:
  - name: Bengali
    iso639_3: ben
    glottocode: beng1280
    classification_path: "Indo-European > Classical Indo-European > Indo-Iranian > Indo-Aryan > Middle-Modern Indo-Aryan > Continental Indo-Aryan > Indo-Aryan Eastern zone > Oriya-Gauda-Kamrupa > Gauda-Kamrupa > Gauda-Banga"
    lat_lon: [24.0, 90.0]
    glottolog_aes: {status: not endangered, source: "Eberhard, Simons & Fennig 2025 (Ethnologue)", comment: "Bengali (ben-ben) = 1 (National)"}
    scripts: [Beng, Latn (romanized, informal)]
    eval_data: {belebele: [ben_Beng, ben_Latn], indicparam: false, indictrans2: ben_Beng}
    feasibility: high
    role: "Regional dominant language; Indo-Aryan anchor; script-twin available"

  - name: Santali
    iso639_3: sat
    glottocode: sant1410
