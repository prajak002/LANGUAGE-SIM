<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" font-family="Helvetica, Arial, sans-serif"><rect width="760" height="210" rx="10" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">How many labels named a different route two years earlier?</text><text x="20" y="50" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">Pages sampled in October 2026, read as they stood in October 2024.</text><text x="20" y="86" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Inherited labels, all four families</text><rect x="290" y="72" width="380" height="20" rx="3" fill="#edf2f7"/><rect x="290" y="72" width="0" height="20" rx="3" fill="#2f855a"><animate attributeName="width" from="0" to="2.0" begin="0.00s" dur="0.9s" fill="freeze"/></rect><text x="680" y="87" font-size="12" fill="#2f855a" text-anchor="start" font-weight="bold">4 of 873</text><text x="20" y="130" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Learned labels, Sanskrit family</text><rect x="290" y="116" width="380" height="20" rx="3" fill="#edf2f7"/><rect x="290" y="116" width="0" height="20" rx="3" fill="#1f2933"><animate attributeName="width" from="0" to="22.2" begin="0.30s" dur="0.9s" fill="freeze"/></rect><text x="680" y="131" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">22 of 376</text><text x="20" y="174" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Learned labels, Romance</text><rect x="290" y="160" width="380" height="20" rx="3" fill="#edf2f7"/><rect x="290" y="160" width="0" height="20" rx="3" fill="#c53030"><animate attributeName="width" from="0" to="266.0" begin="0.60s" dur="0.9s" fill="freeze"/></rect><text x="680" y="175" font-size="12" fill="#c53030" text-anchor="start" font-weight="bold">259 of 370</text></svg>
