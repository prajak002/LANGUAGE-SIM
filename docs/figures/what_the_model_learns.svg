<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 320" width="1140" height="320" font-family="Helvetica, Arial, sans-serif"><rect width="1140" height="320" rx="10" fill="#ffffff"/><defs><marker id="a2b6cb0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="a2f855a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="ac53030" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker></defs><rect x="20" y="30" width="220" height="110" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/><text x="36" y="58" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Modern word</text><text x="36" y="80" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">Hindi, Spanish, ...</text><text x="36" y="98" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Example: जल (Hindi, water)</text><rect x="20" y="170" width="220" height="110" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/><text x="36" y="198" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Ancestor form</text><text x="36" y="220" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">Sanskrit, Latin, ...</text><text x="36" y="238" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Example: जल (Sanskrit)</text><rect x="300" y="70" width="230" height="170" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/><text x="316" y="98" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Model</text><text x="316" y="120" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">Logistic regression on spelling</text><text x="316" y="138" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">distance and letter n-grams;</text><text x="316" y="156" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">a small character Transformer;</text><text x="316" y="174" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">a pretrained character model</text><text x="316" y="192" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">(CANINE-S).</text><path d="M240,85 H270 V130 H298" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a2b6cb0)"/><path d="M240,225 H270 V180 H298" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#a2f855a)"/><polygon points="640,95 720,155 640,215 560,155" fill="#fffff0" stroke="#b7791f" stroke-width="2"/><text x="640" y="150" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">What did</text><text x="640" y="168" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">it learn?</text><path d="M530,155 H558" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a2b6cb0)"/><rect x="790" y="20" width="330" height="130" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/><text x="806" y="48" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">The word's history</text><text x="806" y="70" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">Inherited through Prakrit, or borrowed</text><text x="806" y="88" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">later from Sanskrit books.</text><text x="806" y="106" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Example: जल, Wiktionary says inherited</text><text x="806" y="124" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">(not checked by an expert)</text><rect x="790" y="170" width="330" height="130" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="806" y="198" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">How much the word looks like</text><text x="806" y="220" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">the ancestor form.</text><text x="806" y="238" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Example: जल against जल, distance 0.00,</text><text x="806" y="256" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">so the model says learned: wrong</text><text x="806" y="274" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">by Wiktionary's label</text><path d="M700,140 V85 H788" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#a2f855a)"/><path d="M700,170 V235 H788" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#ac53030)"/><text x="744" y="78" font-size="12" fill="#2f855a" text-anchor="middle" font-weight="bold">hoped for</text><text x="744" y="252" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">what we find</text></svg>
