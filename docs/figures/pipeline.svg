<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1040" width="1140" height="1040" font-family="Helvetica, Arial, sans-serif"><rect width="1140" height="1040" rx="10" fill="#ffffff"/><defs><marker id="a2b6cb0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="a2f855a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="ac53030" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="a6b46c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker></defs><rect x="300" y="20" width="500" height="92" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/><text x="316" y="48" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">Wiktionary categories</text><text x="316" y="70" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">17 language pairs, 4 ancestors, all Indo-European:</text><text x="316" y="88" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">Sanskrit, Latin, Ancient Greek, Old Armenian</text><rect x="350" y="150" width="400" height="80" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/><text x="366" y="178" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">Sample: 13,128 pages</text><text x="366" y="200" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">revision IDs stored</text><rect x="20" y="150" width="260" height="100" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/><text x="36" y="178" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">A. Audit</text><text x="36" y="200" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">class sizes, consistency,</text><text x="36" y="218" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">citations</text><rect x="820" y="150" width="300" height="100" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/><text x="836" y="178" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">D. 48 Hindi and Bengali words</text><text x="836" y="200" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">looked up in four dictionaries</text><text x="836" y="218" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">(automated; 23 of 134 rows checked)</text><rect x="250" y="280" width="290" height="75" rx="10" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/><text x="266" y="308" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">12,778 word senses</text><text x="266" y="330" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">16 languages</text><rect x="570" y="280" width="290" height="75" rx="10" fill="#fffff0" stroke="#b7791f" stroke-width="2"/><text x="586" y="308" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Label history</text><text x="586" y="330" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">2,575 pages in 2021 and 2024</text><rect x="250" y="395" width="290" height="75" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/><text x="266" y="423" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">B. Baseline</text><text x="266" y="445" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">predict the label from form</text><polygon points="395,495 545,560 395,625 245,560" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/><text x="395" y="556" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Does the label agree</text><text x="395" y="574" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">with resemblance?</text><rect x="640" y="520" width="300" height="80" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/><text x="656" y="548" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Congruent items</text><text x="656" y="570" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">model right on about 100%</text><rect x="220" y="740" width="350" height="100" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="236" y="768" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Dissociated items, the hard ones</text><text x="236" y="790" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">model right on 10% (Sanskrit family)</text><text x="236" y="808" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">and 19% (Romance)</text><rect x="660" y="650" width="460" height="62" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="676" y="678" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">A comparative dictionary</text><text x="676" y="700" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">lists a matching form: 46% against 10%</text><path d="M570,790 H615 V681 H658" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#ac53030)"/><rect x="660" y="722" width="460" height="62" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="676" y="750" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">The intermediate stage</text><text x="676" y="772" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">84% unchanged in hard inherited words</text><path d="M570,790 H615 V753 H658" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#ac53030)"/><rect x="660" y="794" width="460" height="62" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="676" y="822" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">Two expert sources</text><text x="676" y="844" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">side with Wiktionary on 45 of 48</text><path d="M570,790 H615 V825 H658" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#ac53030)"/><rect x="660" y="866" width="460" height="62" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="676" y="894" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">Three inputs, three models</text><text x="676" y="916" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">the intermediate form adds nothing</text><path d="M570,790 H615 V897 H658" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#ac53030)"/><path d="M550,112 V148" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a2b6cb0)"/><path d="M350,190 H282" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#a2f855a)"/><path d="M750,190 H818" fill="none" stroke="#6b46c1" stroke-width="2" marker-end="url(#a6b46c1)"/><path d="M450,230 V278" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a2b6cb0)"/><path d="M650,230 V255 H715 V278" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a2b6cb0)"/><path d="M395,355 V393" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a2b6cb0)"/><path d="M395,470 V493" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a2b6cb0)"/><path d="M545,560 H638" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#a2f855a)"/><path d="M395,625 V738" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#ac53030)"/><text x="592" y="552" font-size="12" fill="#2f855a" text-anchor="middle" font-weight="bold">yes</text><text x="415" y="686" font-size="12" fill="#c53030" text-anchor="start" font-weight="bold">no</text><rect x="20" y="960" width="1100" height="60" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1"/><text x="36" y="986" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">Question</text><text x="36" y="1006" font-size="12" fill="#627d98" text-anchor="start" font-weight="normal">What does a model learn from Wiktionary's inherited and learned labels, and are the labels it gets wrong really wrong?</text></svg>
